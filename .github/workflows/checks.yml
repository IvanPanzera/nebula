name: Source and CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qwen/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r qwen/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q qwen installer
      - name: Run CPU and application checks
        run: bash tools/check_cpu.sh python
  installer:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate hardware and installation plans
        shell: powershell
        run: .\installer\test_installer.ps1
      - name: Build the setup executable
        run: python installer/build_release.py
